name: Supabase Migrations CD

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Deploy Migrations to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não está configurado nos Secrets do GitHub. Para ativar o CD de migrações automáticas, adicione SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings -> Secrets and variables -> Actions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Link Supabase Project
        if: steps.check_creds.outputs.has_token == 'true'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'argirbtaibgwktbcmyza' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push Database Migrations
        if: steps.check_creds.outputs.has_token == 'true'
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
