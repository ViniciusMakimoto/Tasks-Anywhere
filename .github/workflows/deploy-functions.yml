name: Supabase Edge Functions CD

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy-functions:
    name: Deploy Edge Functions to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não está configurado nos Secrets do GitHub. Para ativar o deploy contínuo das Edge Functions, adicione SUPABASE_ACCESS_TOKEN em Settings -> Secrets and variables -> Actions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Link Supabase Project
        if: steps.check_creds.outputs.has_token == 'true'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'argirbtaibgwktbcmyza' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy process-task-input Edge Function
        if: steps.check_creds.outputs.has_token == 'true'
        run: |
          supabase functions deploy process-task-input --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
