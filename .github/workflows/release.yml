name: Release Tauri Desktop (Windows & Multiplatform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Native Desktop Installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Run test suite (TDD)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TasksAnywhere ${{ github.ref_name }}'
          releaseBody: 'Veja os instaladores desktop nativos gerados automaticamente pelo pipeline de CI/CD do TasksAnywhere.'
          releaseDraft: false
          prerelease: false
